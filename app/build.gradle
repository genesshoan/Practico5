plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

// Nextcloud convierte los archivos en placeholders y rompe Gradle
// ("not a regular file"): la salida de compilacion va fuera del arbol sincronizado.
layout.buildDirectory = new File(System.getProperty('user.home'), '.gradle-builds/Practico5/app')

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Driver JDBC de MySQL
    implementation 'com.mysql:mysql-connector-j:9.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'ude.bdpractico5.servidor.ServidorRMI'
}

// ./gradlew :app:runServidor  -> publica la Fachada en el registro RMI
tasks.register('runServidor', JavaExec) {
    group = 'application'
    description = 'Levanta el servidor RMI que publica la Fachada'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ude.bdpractico5.servidor.ServidorRMI'
}

// ./gradlew :app:runCliente   -> abre la interfaz grafica
tasks.register('runCliente', JavaExec) {
    group = 'application'
    description = 'Abre la capa grafica, que accede a la Fachada por RMI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ude.bdpractico5.grafica.Principal'
}

tasks.named('test') {
    useJUnitPlatform()
}
